<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cloudflare Chatbot (Minimal)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f6f7f9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-box {
      width: 420px;
      height: 600px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }

    .messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      border-bottom: 1px solid #eee;
    }

    .message {
      margin-bottom: 12px;
    }

    .user {
      font-weight: bold;
    }

    .input-row {
      display: flex;
      padding: 12px;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 8px;
      font-size: 14px;
    }

    button {
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="chat-box">
    <div id="messages" class="messages"></div>

    <div class="input-row">
      <input
        id="input"
        type="text"
        placeholder="Type a message..."
        autocomplete="off"
      />
      <button id="send">Send</button>
    </div>
  </div>

  <script>
    /** ===============================
     * Configuration
     * =============================== */

    // CHANGE THIS to your deployed worker URL
    const API_URL = "https://chatbot-dev.cyy20041234.workers.dev/chat";

    /** ===============================
     * Session handling
     * =============================== */

    function getSessionId() {
      let id = localStorage.getItem("sessionId");
      if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem("sessionId", id);
      }
      return id;
    }

    /** ===============================
     * DOM helpers
     * =============================== */

    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    function addMessage(text, isUser) {
      const div = document.createElement("div");
      div.className = "message";
      div.innerHTML = `<span class="${isUser ? "user" : ""}">
        ${isUser ? "You" : "Bot"}:
      </span> ${text}`;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    /** ===============================
     * Chat logic
     * =============================== */

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      addMessage(text, true);
      inputEl.value = "";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Session-Id": getSessionId()
          },
          body: JSON.stringify({ message: text })
        });

        if (!res.ok) {
          const err = await res.text();
          addMessage(`Error: ${err}`, false);
          return;
        }

        const data = await res.json();
        addMessage(data.reply ?? "(no reply)", false);

      } catch (err) {
        addMessage("Network error", false);
        console.error(err);
      }
    }

    /** ===============================
     * Event listeners
     * =============================== */

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
